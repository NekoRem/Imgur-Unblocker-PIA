# Local SOCKS5 relay for Imgur Unblocker.
# Brave/Chrome can't log in to SOCKS5 proxies, so the extension talks to this
# relay on 127.0.0.1:1080 (no login) and gost adds your PIA credentials.
#
# Copy to ~/.config/gost/pia.yaml, fill in your PIA SOCKS credentials
# (PIA Client Control Panel -> "Generate SOCKS Password"), then:
#   chmod 600 ~/.config/gost/pia.yaml
services:
  - name: imgur-relay
    addr: 127.0.0.1:1080
    handler:
      type: socks5
      chain: pia
    listener:
      type: tcp
chains:
  - name: pia
    hops:
      - name: hop-0
        nodes:
          - name: pia-nl
            addr: proxy-nl.privateinternetaccess.com:1080
            connector:
              type: socks5
              auth:
                username: "x1234567"
                password: "your-socks-password"
            dialer:
              type: tcp
