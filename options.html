<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 380px;
            padding: 12px 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
        }

        label {
            display: block;
            margin: 10px 0 4px;
            font-weight: 600;
        }

        label.inline {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row > div:first-child {
            flex: 1;
        }

        .row > div:last-child {
            width: 90px;
        }

        .hint {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }

        .hidden {
            display: none;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 6px;
            margin: 12px 0 0;
            padding: 4px 12px 12px;
        }

        button {
            margin-top: 10px;
            padding: 6px 16px;
        }

        .status {
            margin-left: 8px;
        }

        .status.ok {
            color: #4CAF50;
        }

        .status.bad {
            color: #d33;
        }
    </style>
</head>
<body>
    <label class="inline"><input type="checkbox" id="enabled"> Route imgur through proxy</label>

    <label for="mode">Proxy</label>
    <select id="mode">
        <option value="pia">PIA account</option>
        <option value="custom">Custom proxy</option>
    </select>

    <fieldset id="piaSection">
        <div id="piaSignedOut">
            <label for="piaUsername">PIA username</label>
            <input type="text" id="piaUsername" placeholder="p1234567" autocomplete="username">
            <label for="piaPassword">PIA password</label>
            <input type="password" id="piaPassword" autocomplete="current-password">
            <div class="hint">Your password is only sent to PIA to get a login token, and is not stored.</div>
            <button id="piaSignIn">Sign in</button><span class="status" id="piaStatus"></span>
        </div>

        <div id="piaSignedIn" class="hidden">
            <div class="hint" id="piaSessionInfo"></div>
            <button id="piaSignOut">Sign out</button>
        </div>

        <label for="piaServer">Location</label>
        <select id="piaServer"></select>
        <div class="hint">UK locations are hidden because imgur blocks the UK.</div>
    </fieldset>

    <fieldset id="customSection" class="hidden">
        <label for="scheme">Proxy type</label>
        <select id="scheme">
            <option value="socks5">SOCKS5 (no login)</option>
            <option value="http">HTTP</option>
            <option value="https">HTTPS</option>
        </select>
        <div class="hint">Brave/Chrome can't log in to SOCKS5 proxies.</div>

        <div class="row">
            <div>
                <label for="host">Host</label>
                <input type="text" id="host" placeholder="127.0.0.1">
            </div>
            <div>
                <label for="port">Port</label>
                <input type="number" id="port" min="1" max="65535" placeholder="1080">
            </div>
        </div>

        <div id="authFields">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="off">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="off">
        </div>
    </fieldset>

    <button id="save">Save</button><span class="status" id="saveStatus"></span>

    <script src="defaults.js"></script>
    <script src="options.js"></script>
</body>
</html>
